name: Production CI/CD Pipline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Django Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/django-site:latest
          no-cache: true

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-server:latest
          no-cache: true

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy and Restart Application on Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          key: ${{ secrets.DEPLOY_SERVER_KEY }}
          script: |
            cd /home/user/app
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            sed -i '/^DOCKER_WEB_IMAGE=/d' .env || true
            sed -i '/^DOCKER_NGINX_IMAGE=/d' .env || true
            echo "DOCKER_WEB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/django-site:latest" >> .env
            echo "DOCKER_NGINX_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/nginx-server:latest" >> .env

            docker compose down

            docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/django-site:latest || true
            docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/nginx-server:latest || true

            docker compose pull

            docker compose up -d --force-recreate --remove-orphans
            
            docker logout
